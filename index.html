```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">

    <title>
        Happy Birthday Noni 🌸
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ========================= -->

    <!-- GLOBAL OVERLAY -->

    <!-- ========================= -->

    <div id="global-overlay"></div>

    <div id="global-flash"></div>

    <!-- ========================= -->

    <!-- GLOBAL PARTICLES -->

    <!-- ========================= -->

    <div id="particles-container"></div>

    <!-- ========================= -->

    <!-- MOVIE -->

    <!-- ========================= -->

    <main id="movie">

        <!-- Scene 1 -->

        <section id="scene-loader" class="scene">

            <div class="scene-content">

                <div id="heartbeat-icon">
                    ❤️
                </div>

                <h1 id="loading-title">
                    Loading Memories...
                </h1>

                <div id="loading-counter">
                    0%
                </div>

            </div>

        </section>

        <!-- Scene 2 -->

        <section id="scene-intro" class="scene">

            <div class="scene-content">

                <p class="quote-text">

                    Every beautiful story

                    has an unexpected beginning...

                </p>

            </div>

        </section>

        <!-- Scene 3 -->

        <section id="scene-story" class="scene">

            <div class="scene-content">

                <div id="story-container">

                </div>

            </div>

        </section>

        <!-- Scene 4 -->

        <section id="scene-childhood" class="scene">

            <div class="scene-content">

                <div class="caption"></div>

                <img id="childhood-photo" alt="Childhood Memory">

            </div>

        </section>

        <!-- Scene 5 -->

        <section id="scene-growth" class="scene">

            <div class="scene-content">

                <div class="caption"></div>

                <img id="growth-photo" alt="Growing Up">

            </div>

        </section>

        <!-- Scene 6 -->

        <section id="scene-present" class="scene">

            <div class="scene-content">

                <div class="caption"></div>

                <img id="present-photo" alt="Present">

            </div>

        </section>

        <!-- Scene 7 -->

        <section id="scene-gift" class="scene">

            <div class="scene-content">

                <button id="gift-box" aria-label="Open Gift">
                    Open Gift
                </button>

            </div>

            <div id="gift-caption">

            </div>

        </section>

        <!-- Scene 8 -->

        <section id="scene-celebration" class="scene">

            <div class="scene-content">

                <div id="balloon-container"></div>

                <div id="firework-container"></div>

                <div id="cake-container">

                    <img id="birthday-cake" src="assets/cake.png" alt="Birthday Cake">

                </div>

                <div id="birthday-message"></div>

            </div>

        </section>

        <!-- Scene 9 -->

        <section id="scene-letter" class="scene">

            <div class="scene-content">

                <div id="letter-container">

                </div>

                <div id="signature">

                    Made with ❤️

                    <br>

                    by

                    <br>

                    MAYANK

                </div>

            </div>

        </section>

    </main>

    <!-- ========================= -->

    <!-- AUDIO -->

    <!-- ========================= -->

    <audio id="bg-music" preload="auto" src="assets/audio/memory-piano.mp3">
    </audio>

    <audio id="heartbeat-audio" preload="auto" src="assets/audio/heartbeat.mp3">
    </audio>

    <audio id="typewriter-audio" preload="auto" src="assets/audio/typewriter.mp3">
    </audio>

    <audio id="bell-audio" preload="auto" src="assets/audio/celebration-chime.mp3">
    </audio>

    <audio id="gift-audio" preload="auto" src="assets/audio/gift-open.mpeg">
    </audio>

    <!-- ========================= -->

    <!-- SCRIPT -->

    <!-- ========================= -->

    <script src="script.js"></script>

</body>

</html>
